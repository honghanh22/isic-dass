[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dass"
version = "1.17.1"
description = "Conditional StyleGAN2-ADA + DASS synthetic-sample selection for imbalanced medical image classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [       # giữ khớp requirements.txt / requirements-dev.txt (tests/regression/test_requirements.py)
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "pydicom>=3.0",     # nguồn DICOM (RSNA Pneumonia)
]

[project.optional-dependencies]
# Colab đã cài sẵn torch và tensorflow; KHÔNG cài lại để tránh lệch phiên bản CUDA.
gan = ["torch", "ninja", "click", "requests", "psutil"]
tf = ["tensorflow>=2.16", "keras-hub"]
dev = ["pytest>=8", "ruff", "dulwich"]

[project.scripts]
dass = "dass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dass = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
