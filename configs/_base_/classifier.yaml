# Classifier downstream: train 2 giai đoạn (head -> fine-tune), chọn epoch theo val, test dự đoán một lần.
classifier:
  # CNN: keras.applications | ViT-B16, SwinT: KerasHub (preset Hugging Face bên dưới, cần `pip install keras-hub`)
  models: [EfficientNetV2B0, ResNet50, DenseNet121, ConvNeXtTiny, ViT-B16, SwinT]
  seeds: [2026, 2027, 2028]     # mỗi backbone × mỗi biến thể × 3 seed -> báo cáo mean ± std
  size: 224
  batch_size: 16
  head_epochs: 5
  head_lr: 0.001
  ft_epochs: 30
  ft_lr: 0.00001
  weight_decay: 0.0001
  dropout: 0.3
  early_stop_patience: 8
  monitor: val_macro_recall     # (sensitivity + specificity) / 2 ở ngưỡng 0.5
  # Người dùng quyết định (1.11.0): KHÔNG can thiệp dữ liệu ở classifier của bất kỳ phương pháp nào, cho MỌI bộ dữ
  # liệu (ISIC v11, RSNA rsna_v2): không augmentation, M0 không class weight (baseline mất cân bằng thật; ROS là
  # baseline cân bằng bằng ảnh thật). Kết quả có augmentation + M0 class weight (ISIC v7 / v10) giữ nguyên trên Drive.
  augment: false                # true: lật / xoay / zoom / sáng / tương phản (chỉ tập train, trực tuyến mỗi batch)
  baseline_class_weight: false  # true: M0 train với class weight (cân bằng trong loss)
  mixed_precision: false
  save_weights_to_drive: true
  vit_preset: hf://keras/vit_base_patch16_224_imagenet     # ViT-B/16, ImageNet, 224 px
  swin_preset: hf://keras/swin_tiny_patch4_window7_224     # Swin-T, ImageNet-1k, 224 px
