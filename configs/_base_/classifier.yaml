# Classifier downstream: train 2 giai đoạn (head -> fine-tune), chọn epoch theo val, test dự đoán một lần.
classifier:
  # ResNet50, ConvNeXtTiny: keras.applications | SwinT: backbone KerasHub; cả ba dùng CÙNG head (GAP + dropout +
  # Dense sigmoid). Thứ tự = thứ tự chạy.
  models: [ResNet50, ConvNeXtTiny, SwinT]
  seeds: [2026, 2027, 2028]     # mỗi backbone × mỗi biến thể × 3 seed -> báo cáo mean ± std
  size: 224
  batch_size: 16
  head_epochs: 5
  head_lr: 0.001
  ft_epochs: 30
  ft_lr: 0.00001
  weight_decay: 0.0001
  dropout: 0.3
  early_stop_patience: 8
  # Chọn epoch (classifier + E_d) theo ROC-AUC trên val (1.12.0, người dùng quyết định): khớp chỉ số chính của bài,
  # không phụ thuộc ngưỡng (công bằng giữa M0 mất cân bằng và biến thể cân bằng), ít nhiễu hơn val_macro_recall
  # (ISIC val chỉ 25 ca dương).
  monitor: val_auc
  # Augmentation chỉ ở B3 (Traditional Augmentation, profile `data.augment_profile`), class weight chỉ ở B1; mọi
  # phương pháp khác train trên đúng ảnh đã ghép (2.0.0).
  mixed_precision: false
  save_weights_to_drive: true
  vit_preset: hf://keras/vit_base_patch16_224_imagenet     # ViT-B/16, ImageNet, 224 px
  swin_preset: swin_tiny_patch4_window7_224                # Swin-T, ImageNet-1k, 224 px (preset KerasHub, tải từ Kaggle)
