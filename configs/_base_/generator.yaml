# StyleGAN2-ADA có điều kiện (bản chính thức NVlabs) — dùng chung mọi bộ dữ liệu.
generator:
  cfg: paper256
  batch: 16
  gamma: 1.0             # trọng số R1
  mirror: true
  aug_target: 0.6        # ADA target
  max_kimg: 3000
  kimg_per_snap: 100
  # early stopping theo KID của lớp thiểu số (Inception-v3, ảnh thật = train lớp thiểu số)
  min_kimg: 400
  patience: 5
  min_rel_delta: 0.02
  kid_n_gen: 1000
  kid_subsets: 50
  kid_seed: 123
  gen_seed: 777          # seed sinh candidate pool (lớp đa số dùng gen_seed + 1)
  trunc_psi: 1.0
  workers: 2
  poll_seconds: 30
  channel_tolerance: 0   # GAN 3 kênh cho dữ liệu 1 kênh: chỉ gộp khi 3 kênh giống hệt nhau
  match_resize_chain: false
  # Chọn snapshot / dừng sớm (1.23.0). kid_inception: KID Inception-v3 (ISIC, RSNA); fid_ed: FID trên đặc trưng E_d
  # (Xue et al. 2021, HistoGAN). Ảnh thật tham chiếu luôn là TRAIN (không dùng val).
  select_metric: kid_inception
  select_classes: minority     # minority | all
  select_aggregate: mean       # select_classes = all: gộp điểm các lớp bằng mean | max (lớp kém nhất)
  select_ema_alpha: 1.0        # điểm chọn = α·điểm + (1 − α)·điểm mượt trước; 1 = không làm mượt
  keep_snapshots: false        # true: giữ mọi snapshot ở stylegan2ada/snapshots/
