# Đánh giá & báo cáo.
evaluation:
  threshold: 0.5                 # ngưỡng CỐ ĐỊNH — không dò trên val / test
  baseline_method: B0_imbalanced  # mốc so sánh thống kê (paired bootstrap ΔAUC): mọi phương pháp vs B0
  comparisons:                   # so sánh bổ sung [phương pháp, đối chứng] (cặp vs baseline đã có sẵn)
    - [M6_dass, M1_random]
    - [M6_dass, B2_ros]
  # Giả thuyết CHÍNH (khai báo trước khi train, 2.0.0): Holm tính riêng trong họ này (mỗi model); mọi so sánh khác
  # là KHÁM PHÁ.
  #   H1: DASS vs Random (M6 vs M1 = B5 vs B4) — đóng góp của CÁCH CHỌN ảnh sinh, mọi thứ khác giống hệt
  #   H2: DASS vs ROS (M6 vs B2) — ảnh sinh đã chọn so với nhân bản ảnh thật (cùng mức cân bằng 1 : 1)
  #   H3: DASS vs Imbalanced (M6 vs B0)
  primary_comparisons:
    - [M6_dass, M1_random]
    - [M6_dass, B2_ros]
    - [M6_dass, B0_imbalanced]
  # Tên hiển thị trong các bảng chung; mã nội bộ (.npz, selections.json) giữ nguyên -> đổi tên chỉ cần chạy lại
  # `report`. `$...$`: công thức trong .tex.
  method_labels:
    B0_imbalanced: Imbalanced Baseline
    B1_class_weight: Cost-sensitive (class-weighted loss)
    B2_ros: Random Oversampling (ROS)
    B3_augment: Traditional Augmentation
    M1_random: "Balanced GAN: Random"
    M2_visual: "Balanced GAN: Visual margin ($M_v$)"
    M3_disease: "Balanced GAN: Disease margin ($M_d$)"
    M4_diversity: "Balanced GAN: Diversity/Coverage"
    M5_visual_disease: "Balanced GAN: $M_v + M_d$"
    M6_dass: "Balanced GAN: DASS (Ours)"
  # Hai bảng kết quả của bài (thứ tự = thứ tự hàng). B4 = M1, B5 = M6: train một lần, xuất ở cả hai bảng.
  result_tables:
    comparison:                  # Nhóm 1: so sánh các phương pháp xử lý mất cân bằng
      B0_imbalanced: "B0: Imbalanced Baseline"
      B1_class_weight: "B1: Cost-sensitive (class-weighted loss)"
      B2_ros: "B2: Random Oversampling"
      B3_augment: "B3: Traditional Augmentation"
      M1_random: "B4: Balanced GAN: Random"
      M6_dass: "B5: Balanced GAN: DASS (Ours)"
    ablation:                    # Nhóm 2: ablation DASS (cùng pool, cùng thành phần dữ liệu)
      M1_random: "M1: Random"
      M2_visual: "M2: Visual margin ($M_v$)"
      M3_disease: "M3: Disease margin ($M_d$)"
      M4_diversity: "M4: Diversity/Coverage"
      M5_visual_disease: "M5: $M_v + M_d$"
      M6_dass: "M6: $M_v + M_d$ + Diversity/Coverage (DASS)"
  n_bootstrap: 2000
  # Đánh giá theo nhóm con (cột metadata, ví dụ [ViewPosition] của RSNA): AUC trong từng nhóm + ΔAUC (Holm), mốc
  # "chỉ dùng thuộc tính", tỉ lệ thuộc tính trong ảnh sinh. Rỗng = bỏ qua (ISIC không có metadata).
  subgroup_columns: []
  kid_subsets: 50                # KID (Inception-v3): mean ± std qua các tập con
  kid_subset_size: 1000
  ssim_pairs: 200
  # Coverage / density (Naeem et al., ICML 2020): ảnh thật được "phủ" nếu có ít nhất một ảnh sinh nằm trong bán kính
  # k láng giềng gần nhất của nó. Tính cho tập ảnh được chọn (E_d, E_v, Inception-v3) so với ảnh thật cùng lớp.
  coverage_k: 5
  latex: true                    # xuất thêm tables/*.tex
