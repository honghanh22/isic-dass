# Đánh giá & báo cáo.
evaluation:
  threshold: 0.5                 # ngưỡng CỐ ĐỊNH — không dò trên val / test
  baseline_method: M0_real_only  # mốc so sánh thống kê (paired bootstrap ΔAUC): mọi phương pháp vs M0
  comparisons:                   # so sánh bổ sung [phương pháp, đối chứng]
    - [M6_dass, M1_random]             # chọn lọc vs chọn ngẫu nhiên — cùng thành phần dữ liệu, cùng pool, cùng số ảnh
    - [M6_dass, M0_real_only]          # (trùng phép so tự động với baseline -> compare_pairs chỉ tính một lần)
  # Giả thuyết CHÍNH (khai báo trước khi train, 1.20.0): Holm tính riêng trong họ này (mỗi model); mọi
  # so sánh khác là KHÁM PHÁ, Holm tính trong họ khám phá.
  #   H1: DASS vs Random (M6 vs M1) — đóng góp của CÁCH CHỌN ảnh sinh, mọi thứ khác giống hệt
  #   H2: DASS vs Imbalanced Baseline (M6 vs M0) — toàn bộ quy trình (ROS + ảnh sinh cân bằng + DASS) so với không làm gì
  primary_comparisons:
    - [M6_dass, M1_random]
    - [M6_dass, M0_real_only]
  # Tên hiển thị trong bảng bài báo; mã nội bộ (trong .npz, selections.json) giữ nguyên -> đổi tên KHÔNG
  # cần train lại, chỉ cần chạy lại `report`. Thứ tự ở đây = thứ tự hàng trong bảng. `$...$`: công thức trong .tex.
  method_labels:
    M0_real_only: Imbalanced Baseline   # `report` tự thêm " (class-weighted)" nếu .npz ghi đã train có class weight
    M1_random: "ROS + Balanced GAN: Random"
    M2_visual: "ROS + Balanced GAN: Visual margin ($M_v$)"
    M3_disease: "ROS + Balanced GAN: Disease margin ($M_d$)"
    M5_diversity: "ROS + Balanced GAN: Diversity ($S_{\\text{div}}$)"
    M4_visual_disease: "ROS + Balanced GAN: Dual margin ($M_v + M_d$)"
    M6_dass: "ROS + Balanced GAN: DASS (Ours)"
  method_groups:
    Real Data Baseline: [M0_real_only]
    ROS + Class-balanced GAN (StyleGAN2-ADA): [M1_random, M2_visual, M3_disease, M5_diversity, M4_visual_disease, M6_dass]
  n_bootstrap: 2000
  # Đánh giá theo nhóm con (cột metadata, ví dụ [ViewPosition] của RSNA): AUC trong từng nhóm + ΔAUC (Holm), mốc
  # "chỉ dùng thuộc tính", tỉ lệ thuộc tính trong ảnh sinh. Rỗng = bỏ qua (ISIC không có metadata).
  subgroup_columns: []
  kid_subsets: 50                # KID (Inception-v3): mean ± std qua các tập con
  kid_subset_size: 1000
  ssim_pairs: 200
  # Coverage / density (Naeem et al., ICML 2020): ảnh thật được "phủ" nếu có ít nhất một ảnh sinh nằm trong bán kính
  # k láng giềng gần nhất của nó. Tính cho tập ảnh được chọn (E_d, E_v, Inception-v3) so với ảnh thật cùng lớp.
  coverage_k: 5
  latex: true                    # xuất thêm tables/*.tex
