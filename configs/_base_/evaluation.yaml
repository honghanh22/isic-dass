# Đánh giá & báo cáo.
evaluation:
  threshold: 0.5                 # ngưỡng CỐ ĐỊNH — không dò trên val / test
  baseline_method: M0_real_only  # mốc so sánh thống kê (paired bootstrap ΔAUC): mọi phương pháp vs M0
  comparisons:                   # so sánh bổ sung [phương pháp, đối chứng]
    - [M6_dass, M0b_real_oversample]   # ảnh sinh (DASS) vs nhân bản ảnh thật — cùng số ảnh, cùng số bước train
    - [M6_dass, M1_random]             # chọn lọc vs chọn ngẫu nhiên — cùng pool, cùng số ảnh
  n_bootstrap: 2000
  kid_subsets: 50                # KID (Inception-v3): mean ± std qua các tập con
  kid_subset_size: 1000
  ssim_pairs: 200
  latex: true                    # xuất thêm tables/*.tex
