# DASS — công thức chuẩn (ISIC v5), dùng chung mọi bộ dữ liệu.
#   M(x)      = S⁺(x) − λ·S⁻(x)          S± = trung bình cosine với TOP-K ảnh thật gần nhất (lớp thiểu số / đa số)
#   S_DASS(x) = α·M̃_v(x) + β·M̃_d(x) + γ·S̃_div(x)   (~ = chuẩn hoá min-max; S_div chuẩn hoá lại mỗi vòng)
selection:
  # k = pool_mult: pool = k × số ảnh cần chọn -> DASS giữ 1/k ảnh (k = 3: giữ 1/3). DÙNG CHUNG cho mọi bộ dữ liệu
  # (không ghi đè trong configs/datasets/). Cố định TRƯỚC khi chạy thực nghiệm chính — không chọn theo kết quả test.
  pool_mult: 3.0
  sim_topk: 5
  lambda_v: 1.0
  lambda_d: 1.0
  alpha: 1.0
  beta: 1.0
  gamma: 0.5
  # M0b: nhân bản ảnh THẬT lớp thiểu số lên 1 : 1 (random oversampling, không class weight) — cùng số ảnh, cùng số
  # bước train, cùng cách cân bằng với M1–M6 -> M6 vs M0b đo đúng đóng góp của nội dung ảnh sinh
  oversample_variant: true
  both_classes_variant: false   # M7 (ảnh sinh ở cả hai lớp) — ngoài bộ M0–M6 chuẩn

encoder:                 # E_v = EfficientNet-B0 ImageNet (đóng băng); E_d = model riêng, train trên ảnh thật
  e_d_model: DenseNet121
  e_d_seed: 4242
  e_d_head_epochs: 5
  e_d_ft_epochs: 20
  embed_batch_size: 32
  e_d_from_run: ""       # "" = E_d của lần chạy này | <run_tag> hoặc "base" (cùng --tag) = dùng lại E_d đã train
