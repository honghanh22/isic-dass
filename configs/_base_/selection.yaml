# DASS — chọn g ảnh sinh lớp thiểu số (g = n_đa số − n_thiểu số, cân bằng 1 : 1) từ pool ⌈k·g⌉ ảnh; dùng chung mọi
# bộ dữ liệu (không ghi đè trong configs/datasets/).
#   M(x)      = S⁺(x) − λ·S⁻(x)          S± = trung bình cosine với TOP-K ảnh thật gần nhất (lớp thiểu số / đa số)
#   S_DASS(x) = α·M̃_v(x) + β·M̃_d(x) + γ·S̃_div(x)   (~ = chuẩn hoá min-max; S_div chuẩn hoá lại mỗi vòng)
selection:
  pool_mult: 2.0       # k (2.0.0, người dùng chọn): pool = k × g -> mỗi phương pháp giữ 1/k = 50 % pool
  sim_topk: 5
  lambda_v: 1.0
  lambda_d: 1.0
  alpha: 1.0           # (α, β, γ) = (1; 1; 0,5) ≡ (0,4; 0,4; 0,2): chỉ tỉ lệ có ý nghĩa
  beta: 1.0
  gamma: 0.5

encoder:                 # E_v = EfficientNet-B0 ImageNet (đóng băng); E_d = model riêng, train trên ảnh thật
  e_d_model: DenseNet121
  e_d_seed: 4242
  e_d_head_epochs: 5
  e_d_ft_epochs: 20
  embed_batch_size: 32
  e_d_from_run: ""       # "" = E_d của lần chạy này | <run_tag> = dùng lại E_d đã train (vd PCam: E_d đã chọn GAN)
