# RSNA Pneumonia Detection Challenge 2018 (X-quang ngực, có / không có đám mờ phổi) — CHỈ các thiết lập phụ thuộc dữ liệu.
# Nguồn: RSNA + NIH ChestX-ray8 (Shih et al., Radiology: AI 2019, doi:10.1148/ryai.2019180041). Mỗi bệnh nhân một ảnh.
paths:
  drive_root: /content/drive/MyDrive/Colab Notebooks/ColabData/RSNA Pneumonia/Result_Pneumonia   # KẾT QUẢ
  gan_tag: rsna          # GAN MỚI (train từ đầu trên ảnh 1 kênh, split của rsna_v2): checkpoints_rsna/stylegan2ada
  # rsna_v1 (tập con 6.000 ảnh, chưa loại "Exclude") chỉ chạy đến prepare, giữ nguyên trên Drive.
  run_tag: rsna_v2

data:
  name: rsna_pneumonia
  channels: 1            # DICOM xám 1 kênh -> PNG "L"; GAN sinh thẳng ảnh 1 kênh; nhân bản 1 -> 3 kênh chỉ trên bộ nhớ
  img_size: 256
  augment_profile: upright   # X-quang có hướng giải phẫu: chỉ lật ngang, xoay ±10° (không lật dọc / xoay 180°)
  classes: {negative: 0, positive: 1}
  source:
    type: dicom_csv
    # DỮ LIỆU GỐC (đường dẫn tuyệt đối, tách khỏi drive_root như Brain Tumor): tìm *.dcm + CSV nhãn đệ quy, tự giải nén
    # .zip / .tar nếu cần, bỏ qua thư mục kết quả. Thư mục này không có dữ liệu mà có đúng một bản "RSNA Pneumonia (1)"
    # (Google Drive tạo khi trùng tên) chứa dữ liệu -> tự đọc từ bản đó.
    train_images: /content/drive/MyDrive/Colab Notebooks/ColabData/RSNA Pneumonia
    # Nhãn tự tìm, hỗ trợ cả hai bản phát hành:
    #  - Kaggle: CSV stage_2_train_labels.csv, cột patientId + Target (1 = có đám mờ phổi)
    #  - trang RSNA (MD.ai): pneumonia-challenge-annotations-adjudicated-kaggle_2018.json, ảnh dương = có chú thích
    #    "Lung Opacity"; âm = "Normal" + "No Lung Opacity / Not Normal"
    train_labels: ""
    id_column: patientId
    label_column: Target
    positive_labels: [Lung Opacity]
    # "Exclude": 106 ảnh không dùng được (chụp nghiêng, ổ bụng, ảnh hỏng), 75 ảnh không có nhãn lâm sàng nào -> loại
    exclude_labels: [Exclude]
    one_per_patient: true   # dùng mapping NIH (pneumonia-challenge-dataset-mappings_2018.json): 1 ảnh / bệnh nhân
    subset_size: 0       # toàn bộ (~12,2 nghìn ảnh sau khi lọc 1 ảnh / bệnh nhân, ~12 % dương); > 0 = tập con phân tầng
  preprocess:
    crop_dark_border: false
    resize: stretch      # ảnh gốc đã vuông (1024 × 1024)
  split:
    type: stratified     # test của cuộc thi không có nhãn -> tự tách 70 / 15 / 15 (mỗi bệnh nhân một ảnh)
    test: 0.15
    val: 0.176
    # GAN `rsna` đã train trên phần train của split rsna_v2 -> mọi lần chạy dùng GAN này (run_tag / --tag mới) phải có
    # ĐÚNG split đó, không thì dừng (GAN có thể đã thấy ảnh val / test). Muốn split khác: train GAN mới (đổi gan_tag)
    # và sửa / bỏ dòng này.
    expected: checkpoints_rsna_v2/data/real_val_split.json

generator:
  # X-quang ngực không đối xứng trái / phải (tim, quai động mạch chủ, chữ đánh dấu L / R): GAN không học bản lật ngang,
  # nếu không khoảng một nửa ảnh sinh có tim bên phải. Mọi tham số GAN khác giữ như ISIC / Brain Tumor.
  mirror: false

classifier:
  # Người dùng quyết định (2026-10-04, trước khi train classifier RSNA): classifier của MỌI biến thể train KHÔNG
  # augmentation. Khác v10 / bt_v5 (có augmentation) -> nêu trong bài báo. Class weight cho M0 giữ nguyên (bật);
  # E_d vẫn train có augmentation (thành phần của DASS); ADA của GAN giữ nguyên.
  augment: false
