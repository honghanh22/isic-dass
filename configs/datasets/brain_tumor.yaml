# Brain Tumor MRI (negative / positive) — CHỈ các thiết lập phụ thuộc dữ liệu.
paths:
  drive_root: /content/drive/MyDrive/Colab Notebooks/ColabData/BrainTumor_GAN
  gan_tag: bt            # dùng lại GAN đã train (checkpoints_bt/stylegan2ada, best KID @ 1200 kimg)
  run_tag: bt_v4         # k = 2, classifier không augmentation, M0 không class weight. (bt_v3 = k = 3, có augmentation
                         # + class weight cho M0 — giữ nguyên; results_bt = notebook v1)

data:
  name: brain_tumor
  channels: 3            # như notebook v1: ảnh lưu 3 kênh, GAN dùng lại (checkpoints_bt) được train trên ảnh 3 kênh
  force_grayscale: true  # MRI xám, nhưng 129 / 2000 ảnh negative (0 / 400 positive) có nhiễu màu JPEG (lệch kênh
                         # ≤ 3.1 mức xám) -> manh mối màu giả gắn với nhãn. Chuyển về luminance rồi lưu 3 kênh BẰNG
                         # NHAU, cho cả ảnh thật lẫn ảnh sinh. 2271 / 2400 ảnh không đổi giá trị.
  img_size: 256
  classes: {negative: 0, positive: 1}
  source:
    type: folders        # nhãn theo thư mục lớp
    train_images: /content/drive/MyDrive/Colab Notebooks/ColabData/Brain_Tumor_Dataset
    test_images: ""      # không có tập test riêng -> tách từ cùng nguồn (split.test)
    class_dirs: {negative: Negative, positive: Positive}
  preprocess:
    crop_dark_border: false   # ảnh đã sát viền (trung vị tỉ lệ nội dung ≈ 0.90)
    resize: pad_square        # đệm vuông, giữ tỉ lệ giải phẫu
  split:
    type: stratified     # 70 / 15 / 15, phân tầng theo lớp — tái lập đúng notebook v1
    test: 0.15
    val: 0.176           # tính trên phần còn lại sau khi tách test
    group_regex: ""      # có mã bệnh nhân trong tên file? ví dụ "^(P\\d+)_" -> chia theo bệnh nhân
    # GAN dùng lại đã train trên phần train của split này -> bắt buộc trùng (không thì dừng: rò rỉ val/test)
    expected: checkpoints_bt/data/real_split.json
