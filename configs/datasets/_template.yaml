# MẪU cho một bộ dữ liệu nhị phân mới. Copy thành configs/datasets/<tên>.yaml, sửa các dòng "← SỬA",
# rồi tạo configs/experiments/<tên>_dass.yaml kế thừa _base_ + file này (xem isic2016_dass.yaml).
paths:
  drive_root: /content/drive/MyDrive/ColabData/MyDataset    # ← SỬA: kết quả / checkpoint ghi vào đây
  gan_tag: v1            # ← SỬA: bộ dữ liệu mới -> GAN mới (dùng GAN của bộ khác sẽ bị chặn)
  run_tag: v1

data:
  name: my_dataset       # ← SỬA (tên ngắn, không dấu cách, KHÁC mọi bộ dữ liệu khác: tên thư mục ổ tạm)
  channels: auto         # auto | 1 | 3
  force_grayscale: false # true cho ảnh y tế xám lưu dạng RGB (MRI, X-quang): lưu các kênh bằng nhau
  img_size: 256
  classes: {normal: 0, abnormal: 1}     # ← SỬA: đúng 2 lớp, 1 = lớp bệnh (thiểu số): metric tính cho lớp 1
  source:
    type: folders        # folders: <train_images>/<thư mục lớp>/* | csv: thư mục phẳng + CSV nhãn
    train_images: train  # ← SỬA
    test_images: test    # "" nếu không có tập test riêng
    class_dirs: {}       # tên lớp -> tên thư mục khi khác nhau
    # type: csv
    # train_labels: labels_train.csv     # cột 1 image_id, cột 2 nhãn (tên lớp hoặc 0/1)
    # test_labels: labels_test.csv
    # header: true
    # image_ext: .png
  preprocess:
    crop_dark_border: false
    resize: stretch      # pad_square để giữ tỉ lệ
  split:
    type: holdout_val    # holdout_val (có test riêng) | stratified (tách test: cần split.test) | file
    val: 0.15
    # type: stratified
    # test: 0.15
    # group_regex: "^(P\\d+)_"
    # type: file
    # file: my_split.csv  # tiêu đề image_id,split; split = train | val (| test)
