# ISIC 2016 Part 3 (dermoscopy, benign / malignant) — CHỈ các thiết lập phụ thuộc dữ liệu.
paths:
  drive_root: /content/drive/MyDrive/Colab Notebooks/ColabData/ISBI2016_ISIC_Part3
  gan_tag: isic_v6       # GAN train lại trên server (2.1.0); GAN cũ checkpoints_v5/ giữ nguyên, không dùng
  run_tag: v14           # thiết kế 2.0.0: B0–B3 + Balanced GAN M1–M6, k = 2. Server: v14_srv.

data:
  name: isic2016
  channels: auto         # -> 3 (RGB)
  img_size: 256
  classes: {benign: 0, malignant: 1}
  source:
    type: csv            # thư mục ảnh phẳng + CSV nhãn (không tiêu đề; nhãn 0/1 hoặc tên lớp)
    train_images: ISBI2016_ISIC_Part3_Training_Data
    train_labels: ISBI2016_ISIC_Part3_Training_GroundTruth.csv
    test_images: ISBI2016_ISIC_Part3_Test_Data
    test_labels: ISBI2016_ISIC_Part3_Test_GroundTruth.csv
    header: false
    image_ext: .jpg
  preprocess:
    crop_dark_border: true   # cắt viền đen của ảnh dermoscopy (khi nội dung < 50 % một cạnh)
    resize: stretch
  split:
    type: holdout_val    # có tập test riêng -> chỉ tách val 15 % từ train (phân tầng, seed toàn cục)
    val: 0.15

generator:
  # Train lại GAN (người dùng quyết định, 2026-10-18), CÙNG luật với PCam được khai báo trước khi train: chấm mọi lớp
  # trên đặc trưng CHÍNH E_d của lần chạy, gộp bằng max (lớp kém nhất quyết định dừng sớm và thiết kế ảnh sinh ở cả hai
  # lớp; thiết kế chỉ thêm ảnh sinh vào lớp thiểu số dùng điểm lớp thiểu số, phát lại trên lịch sử), làm mượt EMA α = 0,5,
  # cùng luật dừng sớm. Khác PCam: KID thay FID, vì lớp ác tính chỉ có 148 ảnh train (FID 1.024 chiều chệch mạnh với
  # ít mẫu, KID không chệch). Giữ mọi snapshot.
  select_metric: kid_ed
  select_classes: all
  select_aggregate: max
  select_ema_alpha: 0.5
  keep_snapshots: true
