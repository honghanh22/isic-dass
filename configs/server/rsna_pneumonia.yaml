# RSNA Pneumonia trên dsserver (UTEHY AI Lab) — kế thừa thực nghiệm chính, chỉ đổi đường dẫn Colab -> HDD của server.
#   dass -c configs/server/rsna_pneumonia.yaml show-config
# Dùng lại GAN `rsna` (split rsna_v2, kiểm tra qua split.expected): cần checkpoints_rsna/ và
# checkpoints_rsna_v2/data/real_val_split.json (chép từ Drive) trong /data/honghanh/results/RSNA/.
_base_:
  - ../experiments/rsna_pneumonia_dass.yaml

paths:
  drive_root: /data/honghanh/results/RSNA
  local_root: /data/honghanh/local_data
  external_root: /data/honghanh/external
  gan_tag: rsna          # dùng lại GAN Colab: checkpoints_rsna/ chép từ Drive

data:
  source:
    train_images: /data/honghanh/datasets/RSNA   # tìm *.dcm + CSV / JSON nhãn đệ quy

classifier:
  # Server: 3 CNN (bỏ DenseNet121 — cùng kiến trúc với E_d; ViT-B16, SwinT — transformer, nặng). Thứ tự = thứ tự chạy.
  models: [EfficientNetV2B0, ResNet50, ConvNeXtTiny]
