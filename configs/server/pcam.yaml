# PCam trên dsserver (UTEHY AI Lab): 3 CNN, E_d train trong lần chạy (dùng cho cả chọn snapshot GAN và M_d).
#   dass -c configs/server/pcam.yaml --tag srv show-config      -> run_tag pcam_v2_srv
_base_:
  - ../experiments/pcam_dass.yaml

paths:
  local_root: /data/honghanh/local_data
  external_root: /data/honghanh/external

classifier:
  models: [ResNet50, ConvNeXtTiny, SwinT]

encoder:
  # DASS dùng CHÍNH E_d đã chọn snapshot GAN (train trong lần chạy pcam_v1_srv) -> nhất quán.
  e_d_from_run: pcam_v1_srv
