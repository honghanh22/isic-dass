# Chạy thử nhanh (kiểm tra code, KHÔNG dùng cho kết quả báo cáo). Ghép SAU một thực nghiệm bất kỳ:
#   dass -c configs/experiments/rsna_pneumonia_dass.yaml -c configs/experiments/smoke.yaml run
# Ghi vào results_smoke / checkpoints_smoke của bộ dữ liệu đó; GAN vẫn dùng lại checkpoint thật (gan_tag giữ nguyên).
paths:
  run_tag: smoke

selection:
  pool_mult: 1.2

encoder:
  e_d_head_epochs: 1
  e_d_ft_epochs: 1

classifier:
  models: [EfficientNetV2B0]
  seeds: [2026]
  head_epochs: 1
  ft_epochs: 1

evaluation:
  n_bootstrap: 100
  kid_subsets: 10
  ssim_pairs: 20

analysis:
  fingerprint_n_max: 64
  fingerprint_epochs: 2
