# THIẾT KẾ A (công thức gốc, chính tới 1.20.x): ảnh sinh CHỈ ở lớp thiểu số, bù tới 1 : 1; baseline ROS (M0b).
# Thiết kế chính từ 1.21.0 là B (configs/_base_/). Profile này khôi phục ĐÚNG cấu hình A để chạy lại `evaluate` /
# `report` hoặc tái lập các lần chạy A. Ghép SAU một thực nghiệm (hoặc config server) và chỉ định run_tag của lần chạy A:
#   dass -c configs/experiments/isic2016_dass.yaml -c configs/experiments/design_a.yaml --set paths.run_tag=v12 report
#   dass -c configs/experiments/rsna_pneumonia_dass.yaml -c configs/experiments/design_a.yaml --set paths.run_tag=rsna_v3 report
#   dass -c configs/server/rsna_pneumonia.yaml -c configs/experiments/design_a.yaml --set paths.run_tag=rsna_v3 --tag srv report
# Các lần chạy A: ISIC v7, v9, v10, v11, v12 (+ v12_srv); RSNA rsna_v2, rsna_v3 (+ rsna_v3_srv). Mỗi .npz ghi `design`
# -> trộn A với B trong một thư mục dự đoán bị chặn.
selection:
  design: minority_only
  filter_majority: false
  balanced_synth_ratio: 0.0     # > 0: thêm biến thể khám phá M8 / M8r / M0c (1.17)
  oversample_variant: true      # M0b: nhân bản ảnh THẬT lớp thiểu số lên 1 : 1 (ROS)

encoder:
  e_d_from_run: ""              # các lần chạy A tự train E_d

evaluation:
  comparisons:
    - [M6_dass, M0b_real_oversample]   # ảnh sinh (DASS) vs nhân bản ảnh thật — cùng số ảnh, cùng số bước train
    - [M6_dass, M1_random]             # chọn lọc vs chọn ngẫu nhiên — cùng pool, cùng số ảnh
  # Họ chính của thiết kế A (khai báo 1.14.0)
  primary_comparisons:
    - [M6_dass, M0b_real_oversample]
    - [M6_dass, M1_random]
    - [M6_dass, M0_real_only]
  method_labels:
    M0_real_only: Imbalanced Baseline
    M0b_real_oversample: Random Oversampling (ROS)
    M0c_real_oversample_matched: ROS (size-matched)   # chỉ có khi selection.balanced_synth_ratio > 0
    M1_random: Unfiltered GAN (Random Selection)
    M2_visual: Visual-only Filter ($M_v$)
    M3_disease: Disease-only Filter ($M_d$)
    M5_diversity: 'Diversity-only Filter ($S_{\text{div}}$)'
    M4_visual_disease: Dual-Margin Filter ($M_v + M_d$)
    M6_dass: DASS (Ours)
    M8r_ros_balanced_random: ROS + Class-balanced Synthetic (Random)   # chỉ có khi selection.balanced_synth_ratio > 0
    M8_ros_balanced_synth: ROS + Class-balanced Synthetic (DASS)   # chỉ có khi selection.balanced_synth_ratio > 0
  method_groups:
    Real Data Baselines: [M0_real_only, M0b_real_oversample, M0c_real_oversample_matched]
    Generative Augmentation (StyleGAN2-ADA): [M1_random, M2_visual, M3_disease, M5_diversity, M4_visual_disease, M6_dass]
    Class-balanced Synthetic (no source shortcut): [M8r_ros_balanced_random, M8_ros_balanced_synth]
