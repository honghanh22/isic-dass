# Độ nhạy theo k (pool_mult) — DÙNG CHUNG cho cả hai bộ dữ liệu. Ghép SAU thực nghiệm chính, BẮT BUỘC kèm --tag:
#   dass -c configs/experiments/brain_tumor_dass.yaml -c configs/experiments/ablation/k2.yaml --tag k2 \
#        run --from prepare --to report
#   dass -c configs/experiments/isic2016_dass.yaml    -c configs/experiments/ablation/k2.yaml --tag k2 \
#        run --from prepare --to report
# Chỉ k thay đổi: GAN dùng chung (gan_tag), split dùng chung, E_d dùng lại của lần chạy chính (e_d_from_run: base).
# Chạy SAU khi lần chạy chính đã qua bước `select` (để có E_d).
_base_: _common.yaml
selection:
  pool_mult: 2.0
