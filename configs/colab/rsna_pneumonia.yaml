# RSNA Pneumonia trên Colab — cấu hình của server (configs/server/rsna_pneumonia.yaml: 3 CNN, 3 seed), chỉ
# khác đường dẫn (Google Drive thay cho HDD của server) và E_d (Colab tự train). run_tag rsna_v5 (server: rsna_v5_srv).
# Có test đối chiếu hai file.
#   dass -c configs/colab/rsna_pneumonia.yaml preflight --fix
# Cần trên Drive (…/RSNA Pneumonia/Result_Pneumonia/):
#   checkpoints_rsna/stylegan2ada/{best.pkl, gan_state.json}      GAN (train trên Colab)
#   checkpoints_rsna_v2/data/real_val_split.json                   split tham chiếu của GAN (không tạo lại được)
_base_:
  - ../experiments/rsna_pneumonia_dass.yaml

classifier:
  # Như server: ResNet50, ConvNeXt-Tiny, Swin-T (cùng head). Thứ tự = thứ tự chạy.
  models: [ResNet50, ConvNeXtTiny, SwinT]

encoder:
  # Như server: E_d train trong lần chạy (cùng công thức: DenseNet121, seed 4242, 5 + 20 epoch, val_auc).
  e_d_from_run: ""
