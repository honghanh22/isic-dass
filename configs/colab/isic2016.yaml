# ISIC 2016 trên Colab — ĐÚNG cấu hình của server (configs/server/isic2016.yaml), chỉ khác đường dẫn (Google Drive)
# -> run_tag v13 (server: v13_srv). Có test đối chiếu hai file.
#   dass -c configs/colab/isic2016.yaml show-config
# Cần trên Drive (…/ISBI2016_ISIC_Part3/):
#   checkpoints_v5/stylegan2ada/{best.pkl, gan_state.json}                GAN (đã có)
#   checkpoints_v12_srv/classifiers/Ed_DenseNet121_s4242.weights.h5       E_d — CHÉP TỪ SERVER
_base_:
  - ../experiments/isic2016_dass.yaml

classifier:
  # 3 CNN như server (bỏ DenseNet121 — cùng kiến trúc với E_d; ViT-B16, SwinT — transformer, nặng). Thứ tự = thứ tự chạy.
  models: [EfficientNetV2B0, ResNet50, ConvNeXtTiny]

encoder:
  # Dùng lại E_d của v12_srv (cùng giao thức val_auc), như server -> chỉ thiết kế tập train thay đổi.
  e_d_from_run: v12_srv
