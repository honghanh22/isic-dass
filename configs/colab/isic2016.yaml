# ISIC 2016 trên Colab — cấu hình của server (configs/server/isic2016.yaml: 3 CNN, 3 seed), chỉ khác đường
# dẫn (Google Drive) và E_d (Colab tự train). run_tag v14 (server: v14_srv). Có test đối chiếu hai file.
#   dass -c configs/colab/isic2016.yaml preflight --fix
# Cần trên Drive (…/ISBI2016_ISIC_Part3/):
#   checkpoints_v5/stylegan2ada/{best.pkl, gan_state.json}         GAN
_base_:
  - ../experiments/isic2016_dass.yaml

classifier:
  # Như server: ResNet50, ConvNeXt-Tiny, Swin-T (cùng head). Thứ tự = thứ tự chạy.
  models: [ResNet50, ConvNeXtTiny, SwinT]

encoder:
  # Như server: E_d train trong lần chạy (cùng công thức: DenseNet121, seed 4242, 5 + 20 epoch, val_auc).
  e_d_from_run: ""
